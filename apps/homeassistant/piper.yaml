apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: piper-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: syno-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: piper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: piper
  template:
    metadata:
      labels:
        app: piper
    spec:
      containers:
        - name: piper
          image: rhasspy/wyoming-piper:2.5.2
          args:
            - --voice=fr_FR-siwis-medium
          ports:
            - containerPort: 10200
          volumeMounts:
            - name: piper-data
              mountPath: /data
          resources:
            limits:
              cpu: "2"
              memory: 512Mi
            requests:
              cpu: "0.05"
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 10200
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: piper-data
          persistentVolumeClaim:
            claimName: piper-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: piper
spec:
  selector:
    app: piper
  ports:
    - protocol: TCP
      port: 10200
      targetPort: 10200
