apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: victoria-metrics-operator

resources:
- namespace.yaml
- httproute.yaml

# Grafana sidecar only watches this namespace: app dashboards live here.
configMapGenerator:
- name: grafana-dashboards-cloudflare-tunnel
  files:
  - dashboards/cloudflare-tunnel-controller.json
  - dashboards/cloudflare-tunnel-traffic.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"

helmCharts:
- name: victoria-metrics-operator-crds
  repo: https://victoriametrics.github.io/helm-charts/
  releaseName: victoria-metrics-operator-crds
  namespace: victoria-metrics-operator
  version: 0.6.1
- name: victoria-metrics-k8s-stack
  repo: https://victoriametrics.github.io/helm-charts/
  releaseName: victoria-metrics-k8s-stack
  namespace: victoria-metrics-operator
  version: 0.66.1
