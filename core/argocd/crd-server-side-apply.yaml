# Since Argo CD 3.3 the ApplicationSet CRD exceeds the client-side apply
# last-applied annotation limit: CRDs must be applied server-side.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: all-argocd-crds
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
